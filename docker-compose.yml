services:
  db:
    image: postgres:16-alpine
    container_name: pollipop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollipop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollipop}
      POSTGRES_DB: ${POSTGRES_DB:-pollipop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollipop} -d ${POSTGRES_DB:-pollipop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pollipop-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pollipop}:${POSTGRES_PASSWORD:-pollipop}@db:5432/${POSTGRES_DB:-pollipop}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeInDev123!}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-ChangeMeInDev123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pollipop-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pollipop}:${POSTGRES_PASSWORD:-pollipop}@db:5432/${POSTGRES_DB:-pollipop}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-secure-random-32-char-secret}
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: pollipop-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
